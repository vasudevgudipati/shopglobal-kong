# Konnect AI Gateway data plane (standalone values - does not use common-dp.yaml).
# Endpoints come from helm/uat/ai-gw-endpoints.env via --set in the Jenkinsfile.
ingressController:
  enabled: false
image:
  repository: kong/kong-ai-gateway
  tag: "2.3.0-distroless"
deployment:
  kong:
    initContainers:
      clearStalePid:
        enabled: false   # the distroless AI image has no "rm"; this init container would crash
secretVolumes:
  - kong-cluster-cert
env:
  role: data_plane
  database: "off"
  konnect_mode: "on"
  vitals: "off"
  cluster_mtls: pki
  cluster_cert: /etc/secrets/kong-cluster-cert/tls.crt
  cluster_cert_key: /etc/secrets/kong-cluster-cert/tls.key
  lua_ssl_trusted_certificate: system
  proxy_access_log: "off"
  dns_stale_ttl: "3600"
# Redis Stack password for the AI policies and semantic routing. The gateway config holds only {vault://env/redis-password};
# Kong reads the value from this environment variable. The Secret redis-auth is created by the platform pipeline.
customEnv:
  REDIS_PASSWORD:
    valueFrom:
      secretKeyRef:
        name: redis-auth
        key: password
  # "Bearer <OpenAI key>" for the semantic cache's embeddings call ({vault://env/openai-auth-header}). Secret openai-auth: platform pipeline.
  OPENAI_AUTH_HEADER:
    valueFrom:
      secretKeyRef:
        name: openai-auth
        key: header
  # "Basic ..." header for the OpenSearch HTTP Log policy ({vault://env/opensearch-auth}). Secret opensearch-auth: platform pipeline.
  OPENSEARCH_AUTH:
    valueFrom:
      secretKeyRef:
        name: opensearch-auth
        key: header
# Status port 8100: Prometheus metrics (/metrics), scraped by k8s/uat/prometheus.yaml.
status:
  enabled: true
  http: { enabled: true, containerPort: 8100 }
resources:
  requests: { cpu: "1", memory: 2Gi }
proxy:
  enabled: true
  type: NodePort
  http: { enabled: true, servicePort: 80,  nodePort: 30090 }
  tls:  { enabled: true, servicePort: 443, nodePort: 30444 }
admin:
  enabled: false
manager:
  enabled: false
