# Exposes the API gateway data plane's status port (Prometheus metrics at /metrics) so Prometheus on .42 can scrape it.
apiVersion: v1
kind: Service
metadata:
  name: kong-api-dp-status
  namespace: shopglobal-uat-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: kong-api-dp
  ports:
    - name: status
      port: 8100
      targetPort: 8100
      nodePort: 30100
