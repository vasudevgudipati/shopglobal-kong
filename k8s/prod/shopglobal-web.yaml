# PROD website. Applied by jenkins/prod/app.Jenkinsfile (it fills in IMAGE_WEB and AGENT_URL). Namespace shopglobal-app-prod, node kongdp1.
# One replica on purpose: sign-in sessions are held in the pod's memory. NGINX can list kongdp1 and kongdp2 on the NodePort (kube-proxy forwards to the pod).
# The website calls the Kong API gateway INSIDE the cluster (service kong-api-dp-prod-kong-proxy) on the token-free route /internal/api, like UAT (Option A).
# No Keycloak client or secret is needed. Kong only accepts this route from allowed source IPs: the Kong chat must allow the kongdp1 pod subnet 10.244.1.0/24
# (this pod runs on kongdp1) on the shopglobal-mock-api-internal service, otherwise the website gets 403.
apiVersion: apps/v1
kind: Deployment
metadata: { name: shopglobal-web, namespace: shopglobal-app-prod }
spec:
  replicas: 1
  selector: { matchLabels: { app: shopglobal-web } }
  template:
    metadata: { labels: { app: shopglobal-web } }
    spec:
      nodeSelector: { kubernetes.io/hostname: kongdp1 }
      # The name does not resolve inside the cluster; map it to the virtual IP of the two NGINX servers.
      hostAliases:
        - ip: "192.168.19.10"
          hostnames: ["shopglobal-api.pronteff.com"]
      containers:
        - name: app
          image: IMAGE_WEB
          ports: [{ containerPort: 8080 }]
          env:
            - { name: APP_ENV, value: "PROD" }
            - { name: SHOPGLOBAL_API_BASE_URL, value: "http://kong-api-dp-prod-kong-proxy.shopglobal-prod-api.svc.cluster.local/internal" }
            - { name: AGENT_REMOTE_URL, value: "AGENT_URL" }
            - { name: AGENT_REMOTE_PREFIX, value: "" }       # AGENT_URL already ends in /internal/agent (Kong proxy), so no /agent prefix
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 8080 }, initialDelaySeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: shopglobal-web, namespace: shopglobal-app-prod }
spec:
  type: NodePort
  selector: { app: shopglobal-web }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30200 }]
