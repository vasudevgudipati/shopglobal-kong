# Exposes the PROD API gateway data plane status port (Prometheus metrics at /metrics) on both API nodes.
apiVersion: v1
kind: Service
metadata:
  name: kong-api-dp-prod-status
  namespace: shopglobal-prod-api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: kong-api-dp-prod
  ports:
    - name: status
      port: 8100
      targetPort: 8100
      nodePort: 30100
