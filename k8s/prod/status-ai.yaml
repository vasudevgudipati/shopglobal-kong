# Exposes the PROD AI gateway data plane status port (Prometheus metrics at /metrics) on the AI node(s).
apiVersion: v1
kind: Service
metadata:
  name: kong-ai-gw-prod-status
  namespace: shopglobal-prod-ai
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kong
    app.kubernetes.io/instance: kong-ai-gw-prod
  ports:
    - name: status
      port: 8100
      targetPort: 8100
      nodePort: 30101
